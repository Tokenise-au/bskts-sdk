# API contract, live: refreshes contract/ from https://api.bskts.xyz and runs
# the contract tests against it. PR CI (ci.yml) runs the same tests offline on
# the vendored snapshot; this catches the API moving on without the SDK.
#
# 2026-10-25: added after the 2026-10-24 limit-order release, where the SDK and
# the API disagreed while each repo's own tests passed. Fails when the SDK no
# longer matches the live API, or when openapi.json changed and the snapshot
# needs `pnpm run contract:refresh` (then commit it, with any SDK fix).
#
# Actions are pinned to full commit SHAs, as in ci.yml.
name: API contract (live)

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: SDK and MCP against the live API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh contract/ from the live API
        run: pnpm run contract:refresh
      # the MCP tests import @bskts/sdk's built package
      - name: Build
        run: pnpm run build
      - name: Contract tests
        run: pnpm exec vitest run packages/sdk/src/contract.test.ts packages/mcp/src/contract.test.ts
      # responses/ hold live values and change every run; the spec should not
      - name: Snapshot of openapi.json is current
        if: ${{ !cancelled() }}
        run: |
          git diff --stat --exit-code contract/openapi.json || {
            echo "::error::The API's openapi.json changed: run pnpm run contract:refresh and commit contract/."
            exit 1
          }
