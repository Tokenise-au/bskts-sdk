# Release: on main, Changesets opens (or updates) a "Version packages" PR from
# the merged changesets; merging that PR publishes the bumped packages to npm.
#
# npm trusted publishing (OIDC): no npm token is stored anywhere. Each package
# is linked to this repo and this workflow file on npmjs.com (package Settings
# -> Trusted publishing), and npm issues a short-lived credential per run.
# Provenance is attached automatically (public repo). The first publish of a
# new package needs a one-time manual publish or an npm org owner to create the
# package before trusted publishing can be configured for it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the version commit and tags
      pull-requests: write # the "Version packages" PR
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # trusted publishing needs npm >= 11.5
      - run: npm install -g npm@latest
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 input names (v1's version/publish/title/commit were renamed and now fail the run)
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
