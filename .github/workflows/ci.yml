# CI: lint, format, typecheck, tests, build, and package checks (publint +
# arethetypeswrong) on every PR and push to main. Offline: no secrets.
#
# Actions are pinned to full commit SHAs, not tags (a tag can be moved to
# malicious code, as happened to tj-actions/changed-files in 2025).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json "packageManager")
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Format
        run: pnpm run format:check
      # build before typecheck: @bskts/mcp type-checks against @bskts/sdk's built types
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests
        run: pnpm test
      - name: Package checks (publint, arethetypeswrong)
        run: pnpm run check:packages
